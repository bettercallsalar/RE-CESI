name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/azure/bootstrap-vm.sh"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        options:
          - prod
          - dev
        default: prod
      apply:
        description: Apply the reviewed production plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: recesi-terraform-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_admin_ssh_public_key: ${{ vars.TF_ADMIN_SSH_PUBLIC_KEY }}
  TF_VAR_budget_contact_emails: ${{ vars.TF_BUDGET_CONTACT_EMAILS }}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  plan:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((inputs.environment == 'prod' && github.ref == 'refs/heads/main') ||
      (inputs.environment == 'dev' && github.ref == 'refs/heads/dev'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      TF_STATE_KEY: recesi-${{ inputs.environment }}.terraform.tfstate
      TFVARS_FILE: environments/${{ inputs.environment }}.tfvars
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Initialize remote backend
        run: terraform init -input=false -reconfigure -backend-config="key=$TF_STATE_KEY"

      - name: Create plan
        run: terraform plan -input=false -var-file="$TFVARS_FILE" -out=recesi.tfplan

      - name: Render plan for review
        run: terraform show -no-color recesi.tfplan > recesi-plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: recesi-${{ env.DEPLOYMENT_ENVIRONMENT }}-terraform-plan-${{ github.run_id }}
          path: |
            terraform/recesi.tfplan
            terraform/recesi-plan.txt
          retention-days: 1
          if-no-files-found: error

  apply:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'prod' &&
      inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: infrastructure-production
    env:
      TF_STATE_KEY: recesi-prod.terraform.tfstate
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/download-artifact@v4
        with:
          name: recesi-prod-terraform-plan-${{ github.run_id }}
          path: terraform

      - name: Initialize remote backend
        run: terraform init -input=false -reconfigure -backend-config="key=$TF_STATE_KEY"

      - name: Apply reviewed plan
        run: terraform apply -input=false recesi.tfplan
