name: Build & Push Docker Images

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "db/**"
      - "docker/docker-compose.yml"
      - "docker/Caddyfile"
      - "Directory.Build.props"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RESR.WebAPI/Dockerfile
          target: final
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/re-cesi-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/re-cesi-api:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=recesi-api
          cache-to: type=gha,mode=max,scope=recesi-api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/RESR.Frontend
          file: src/RESR.Frontend/Dockerfile
          target: final
          push: true
          build-args: VITE_API_BASE_URL=
          tags: |
            ghcr.io/${{ github.repository_owner }}/re-cesi-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/re-cesi-frontend:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=recesi-frontend
          cache-to: type=gha,mode=max,scope=recesi-frontend

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: db/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/re-cesi-migrations:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/re-cesi-migrations:${{ github.ref_name }}-latest
          cache-from: type=gha,scope=recesi-migrations
          cache-to: type=gha,mode=max,scope=recesi-migrations
